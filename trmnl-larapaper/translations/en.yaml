---
configuration:
  app_url:
    name: App URL
    description: >-
      Address the TRMNL device (and your browser) uses to reach this add-on, e.g.
      http://192.168.1.10:4567. The device downloads its screen image from here, so
      use an IP address or a name the device can resolve.
  registration_enabled:
    name: Allow registration
    description: Turn off after creating your account.
  home_assistant_access:
    name: Home Assistant access for recipes
    description: >-
      What recipes can read from Home Assistant at http://127.0.0.1:8124 without an
      access token. calendars: calendar events and daily weather forecasts. read: also
      every entity's state and history. off: nothing. Every installed recipe can read
      what this allows.
