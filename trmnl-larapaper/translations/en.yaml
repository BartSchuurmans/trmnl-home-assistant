---
configuration:
  app_url:
    name: App URL
    description: >-
      Address the TRMNL device (and your browser) uses to reach this add-on, e.g.
      http://192.168.1.10:4567. The device downloads its screen image from here, so
      use an IP address or a name the device can resolve.
  multiuser_registration:
    name: Allow more accounts
    description: >-
      The first account can always be created. Turn on to let anyone reaching the web
      UI create further accounts; LaraPaper then stops rendering Blade recipes.
