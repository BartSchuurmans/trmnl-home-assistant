---
name: LaraPaper (BYOS)
version: "0.43.1"
slug: trmnl-larapaper
description: >-
  Runs LaraPaper, a self-hosted TRMNL server (BYOS) with recipes, playlists and
  mashups, and shows each TRMNL in Home Assistant
url: https://github.com/usetrmnl/trmnl-home-assistant
image: ghcr.io/usetrmnl/trmnl-larapaper-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: services
stage: experimental
# The Supervisor token lets the Home Assistant proxy on 127.0.0.1:8124 read calendars
# (and, with home_assistant_access: read, states and history) for recipes
homeassistant_api: true
# The Mosquitto broker's address and login, for the device sensors (mqtt.php); the
# add-on also runs without a broker
services:
  - mqtt:want
# The web UI through Home Assistant (sidebar, Open Web UI), also away from home;
# ingress_port is left at its default, 8099
ingress: true
panel_icon: mdi:tablet-dashboard
panel_title: LaraPaper
# The TRMNL device API (and the web UI) on the home network
ports:
  8080/tcp: 4567
ports_description:
  8080/tcp: TRMNL device API and LaraPaper web UI
options:
  app_url: ""
  registration_enabled: true
  home_assistant_access: calendars
  prerender: true
  mqtt: true
schema:
  app_url: url
  registration_enabled: bool
  home_assistant_access: list(off|calendars|read)
  prerender: bool
  mqtt: bool
